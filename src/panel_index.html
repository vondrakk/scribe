<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scribe</title>
<link rel="stylesheet" href="/xterm.css">
<script src="/xterm.js"></script>
<script src="/addon-fit.js"></script>
<style>
:root{--bg:#0f1115;--panel:#171a21;--line:#262b35;--fg:#e6e9ef;--mut:#8b94a7;
--accent:#6ea8fe;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171;--chip:#1f2530;}
*{box-sizing:border-box}
body{margin:0;font:14px/1.5 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
background:var(--bg);color:var(--fg)}
header{display:flex;align-items:center;gap:16px;padding:12px 20px;border-bottom:1px solid var(--line);
position:sticky;top:0;background:var(--bg);z-index:5}
header h1{font-size:16px;margin:0;letter-spacing:.3px}
.bind{margin-left:auto;font-size:13px;color:var(--mut)}
.bind b{color:var(--accent)}
nav{display:flex;flex-wrap:wrap;gap:4px;padding:0 20px;border-bottom:1px solid var(--line);background:var(--bg);
position:sticky;top:49px;z-index:4}
nav button{background:none;border:0;color:var(--mut);padding:12px 14px;cursor:pointer;
font-size:13px;border-bottom:2px solid transparent}
nav button.on{color:var(--fg);border-bottom-color:var(--accent)}
nav .count{display:inline-block;min-width:18px;padding:0 5px;margin-left:6px;border-radius:9px;
background:var(--chip);font-size:11px;color:var(--mut)}
main{padding:20px;max-width:none;margin:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:10px 0}
.row{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.tag{font-size:11px;padding:2px 8px;border-radius:20px;background:var(--chip);color:var(--mut)}
.tag.planned{color:var(--ok)} .tag.interrupt{color:var(--warn)} .tag.unaccounted{color:var(--bad)}
.key{color:var(--accent);font-weight:600}
.mut{color:var(--mut)} .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.summary{margin:8px 0;color:var(--fg)}
.btn{background:var(--chip);border:1px solid var(--line);color:var(--fg);border-radius:7px;
padding:6px 12px;cursor:pointer;font-size:13px}
.btn:hover{border-color:var(--accent)}
.btn.ok{color:var(--ok)} .btn.bad{color:var(--bad)} .btn.go{background:var(--accent);color:#06121f;border-color:var(--accent)}
.actions{display:flex;gap:8px;margin-top:10px}
pre{white-space:pre-wrap;background:#10131a;border:1px solid var(--line);border-radius:7px;
padding:10px;margin:8px 0;font-family:ui-monospace,monospace;font-size:12.5px;color:#cdd3df}
textarea{width:100%;min-height:150px;background:#10131a;color:var(--fg);border:1px solid var(--line);
border-radius:7px;padding:10px;font-family:ui-monospace,monospace;font-size:12.5px}
.ev{display:grid;grid-template-columns:120px 70px 1fr;gap:10px;padding:5px 0;border-top:1px solid var(--line);font-size:12.5px}
.ev:first-child{border-top:0}
.status{font-size:11px;padding:2px 8px;border-radius:20px}
.status.draft{background:#1f2530;color:var(--mut)}
.status.approved{background:#14331f;color:var(--ok)}
.status.published{background:#102a3a;color:var(--accent)}
.status.discarded{background:#331616;color:var(--bad)}
.empty{color:var(--mut);padding:30px;text-align:center}
.toolbar{display:flex;gap:8px;margin-bottom:12px}
small.src{color:var(--mut)}
label{display:block;margin:12px 0 4px;color:var(--mut);font-size:12px}
input[type=number],input[type=text]{background:#10131a;color:var(--fg);border:1px solid var(--line);
border-radius:6px;padding:6px 8px;width:140px}
#bar{display:flex;align-items:center;gap:10px;padding:8px 20px;border-bottom:1px solid var(--line);
background:var(--panel);position:sticky;top:49px;z-index:4;flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.dot.on{background:var(--ok);box-shadow:0 0 6px var(--ok)} .dot.off{background:var(--warn)}
#bar .now{font-size:12px}
#bar .btn{padding:4px 10px;font-size:12.5px}
.binfo{font-size:13px} .binfo b{color:var(--accent)}
.picker{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-left:4px}
.chip{cursor:pointer;font-size:12px;padding:3px 9px;border-radius:20px;background:var(--chip);
border:1px solid var(--line);color:var(--fg)}
.chip:hover{border-color:var(--accent)}
.capwarn{background:#2a2410;border:1px solid #5c4a12;color:var(--warn);padding:8px 12px;border-radius:8px;
margin:10px 0;font-size:12.5px}
.capwarn code{background:#10131a;padding:2px 6px;border-radius:4px;color:var(--fg)}
nav{top:93px}
.srow{display:grid;grid-template-columns:26px 104px 74px 1fr auto;gap:10px;align-items:start;padding:9px 16px;border-top:1px solid var(--line)}
.srow:first-child{border-top:0}
.srow.sel{background:var(--chip)}
.sdir{font-size:10.5px;padding:2px 8px;border-radius:20px;background:var(--chip);white-space:nowrap;align-self:start}
.sdir.work{color:var(--accent)} .sdir.out{color:var(--ok)} .sdir.in{color:var(--warn)}
.stime{font-size:12px;white-space:nowrap} .scheck{padding-top:1px}
.stitle{min-width:0;font-size:13.5px}
.sdet{font-size:12px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sact{white-space:nowrap;align-self:center}
select.btn{padding:6px 8px}
@media (max-width:560px){.srow{grid-template-columns:24px 1fr auto}.stime,.sdir{display:none}}
/* humanized stream feed */
.sday{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);font-weight:600;padding:18px 4px 4px;display:flex;align-items:center}
.daybtn{margin-left:10px;padding:2px 9px;font-size:11px;letter-spacing:.02em;text-transform:none;opacity:.55}
.daybtn:hover{opacity:1;border-color:var(--accent)}
.frow{display:grid;grid-template-columns:14px 10px 1fr auto auto;gap:10px;align-items:start;
padding:10px 13px;border:1px solid var(--line);border-radius:10px;background:var(--panel);margin:7px 0}
.frow[draggable=true]{cursor:grab} .frow[draggable=true]:active{cursor:grabbing}
.frow.sel{outline:2px solid var(--accent);outline-offset:-1px}
.fdot{margin-top:5px} .ftime,.fact{align-self:center}
.fexp{cursor:pointer;color:var(--mut);font-size:12px;user-select:none;align-self:center;text-align:center}
.fexp:hover{color:var(--fg)}
.schip.tkt{background:#102a3a;color:var(--accent);border:1px solid #1d3a52;margin-left:8px}
.schip.tag{background:#1c2a1c;color:#86d17a;border:1px solid #2d4a2d;margin-left:6px}
.fdetail{margin-top:10px;padding:10px 12px;background:#0b0e14;border:1px solid var(--line);border-radius:8px}
.fdetail .cmd{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:#cdd3df;white-space:pre-wrap;padding:1px 0}
.fdetail .cmt{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:#86d17a;padding:1px 0}
.tagin{background:#10131a;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:5px 8px;width:150px;font-size:12.5px}
.tagbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0 2px}
.tfilter{font-size:12px;padding:3px 10px;border-radius:999px;background:var(--chip);border:1px solid var(--line);color:var(--mut);cursor:pointer}
.tfilter:hover{border-color:var(--accent)} .tfilter.on{color:var(--fg);border-color:var(--accent);background:#102a3a}
.rlink{font-size:12px;color:var(--accent);cursor:pointer}
.gtoggle{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;margin-right:4px}
.gopt{font-size:12px;padding:3px 11px;color:var(--mut);cursor:pointer}
.gopt:hover{color:var(--fg)} .gopt.on{color:var(--fg);background:#102a3a}
.wltotals{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.wlbar{display:flex;align-items:center;gap:12px;padding:7px 10px;background:var(--panel);border:1px solid var(--line);border-radius:8px}
.wlproj{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.wlsecs b{color:var(--accent)}
.wlrow{display:flex;align-items:center;gap:10px;font-size:12.5px;padding:6px 2px;border-bottom:1px solid var(--line)}
.wltime{width:118px;flex:none;font-size:11.5px} .wldur{width:64px;flex:none} .wldur b{color:var(--accent)}
.wlp{max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wlc{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.selbar{margin:8px 0;padding:8px 12px;border:1px solid var(--accent);border-radius:8px;background:#102a3a;font-size:12.5px;color:var(--fg)}
.lgrow{display:flex;align-items:flex-start;gap:8px;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:var(--panel);margin:6px 0}
.lgrow .fmain{display:flex;flex-wrap:wrap;align-items:center;gap:6px;flex:1;min-width:0}
.lghead{font-weight:600;font-size:13.5px}
.lgtitle{font-size:12.5px;max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bdrow{display:flex;gap:14px;align-items:baseline;font-size:12.5px;padding:3px 0}
.bdsecs{color:var(--accent);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;min-width:64px}
.rulesbox{border:1px solid var(--line);border-radius:9px;padding:8px;margin:6px 0;background:var(--panel);display:flex;flex-direction:column;gap:5px}
.rulerow{display:flex;align-items:center;gap:10px;font-size:12.5px}
.rprefix{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rdel{color:var(--bad);cursor:pointer;font-size:12px} .rdel:hover{text-decoration:underline}
.timebar{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;font-size:12.5px;margin:6px 0 2px;padding:8px 10px;background:var(--panel);border:1px solid var(--line);border-radius:9px}
.timebar .tk{color:var(--mut)} .timebar b{color:var(--fg)}
.timebar .grp{color:var(--mut);font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin-right:2px}
.fdur{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:var(--accent)}
.fdot{width:9px;height:9px;border-radius:50%;background:var(--mut)}
.role-work .fdot{background:var(--accent)}
.role-interrupt .fdot{background:var(--warn)}
.role-unacc .fdot{background:var(--mut)}
.role-draft{border-left:3px solid var(--warn)} .role-draft .fdot{background:var(--warn)}
.role-sent{opacity:.7} .role-sent .fdot{background:var(--ok)}
.role-in{border-left:3px solid #2f4fd4} .role-in .fdot{background:#6ea8fe}
.schip.inbound{background:#111f33;color:#86a6ff;border:1px solid #243a5e}
.fmain{min-width:0}
.fhead{font-weight:600;font-size:14px}
.ftag{font-size:12.5px;color:var(--mut)}
.sdet{font-size:12px;color:var(--mut);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ftime{font-size:12px;white-space:nowrap} .fact{white-space:nowrap}
.schip{font-size:11px;padding:2px 9px;border-radius:999px;white-space:nowrap}
.fmain .schip{margin-left:8px}
.schip.draft{background:#2a2410;color:var(--warn);border:1px solid #5c4a12}
.schip.approved{background:#102a3a;color:var(--accent);border:1px solid #1d3a52}
.schip.published{background:#12271f;color:var(--ok);border:1px solid #1d3f2e}
.fx{font-family:var(--mono);font-size:12px;color:var(--accent);margin-right:6px}
.fact .btn{padding:4px 9px;font-size:12px}
/* two-pane builder */
.streamwrap{display:grid;grid-template-columns:1fr 340px;gap:16px;align-items:start}
.feedpane{min-width:0}
.buildpane{position:sticky;top:104px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.dropzone{min-height:150px;border:2px dashed var(--line);border-radius:10px;padding:10px;margin-top:8px;display:flex;flex-direction:column;gap:6px}
.dropzone.over{border-color:var(--accent);background:var(--chip)}
.dzhint{font-size:12.5px;margin:auto;text-align:center;padding:14px;color:var(--mut)}
.bchip{display:flex;justify-content:space-between;gap:8px;background:var(--chip);border:1px solid var(--line);border-radius:7px;padding:6px 10px;font-size:12.5px}
.bchip .x{cursor:pointer;color:var(--mut)} .bchip .x:hover{color:var(--bad)}
.builtbox{margin-top:12px;padding:10px 12px;border:1px solid #1d3f2e;background:#12271f;border-radius:9px;color:var(--ok);font-size:13px}
@media (max-width:620px){.frow{grid-template-columns:9px 1fr auto}.ftime{display:none}}
@media (max-width:820px){.streamwrap{grid-template-columns:1fr}.buildpane{position:static}}
/* terminal tabs + big scrollback output */
.tterms{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
.tterm{background:var(--chip);border:1px solid var(--line);color:var(--mut);border-radius:7px 7px 0 0;
padding:6px 12px;cursor:pointer;font-size:12.5px;display:flex;align-items:center;gap:7px}
.tterm.on{color:var(--fg);background:#0b0e14;border-bottom-color:#0b0e14}
.tterm .x{color:var(--mut);font-size:15px;line-height:1}
.tterm .x:hover{color:var(--bad)}
.tterm.add{color:var(--accent);border-radius:7px}
pre.term{min-height:460px;height:64vh;max-height:none;overflow:auto;background:#0b0e14;border:1px solid var(--line);
border-radius:0 7px 7px 7px;padding:12px;font-size:12.5px;line-height:1.5;white-space:pre-wrap;color:#d6dbe6;resize:vertical}
#ptymount{height:66vh;min-height:420px;background:#0b0e14;border:1px solid var(--line);border-radius:0 7px 7px 7px;padding:6px 8px;overflow:hidden}
.xtermhost{height:100%;width:100%}
.xterm{height:100%}
</style></head>
<body>
<header><h1>🪶 Scribe</h1><div class="bind" id="bind">…</div></header>
<div id="bar"></div>
<nav id="nav"></nav>
<div id="cap"></div>
<main id="main"></main>
<script>
const TABS=["Stream","Logged","Terminal","Ansible","Scratchpad","Timeline","Episodes","Drafts","Unaccounted","Prompts","Settings"];
let state={}, cur="Stream", pickerOpen=false, streamSel=new Set();
const fmt=t=>new Date(t*1000).toLocaleString([], {month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
const esc=s=>(s||"").replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
async function api(u,opt){const r=await fetch(u,opt);return r.json();}
async function refresh(){state=await api('/api/state');draw();}
// Something is mid-interaction (editing a draft, or the bind picker is open) —
// used to suppress destructive live reloads.
function busy(){return pickerOpen || !!document.querySelector('textarea');}
function drawNav(){
  const n=document.getElementById('nav');n.innerHTML='';
  TABS.forEach(t=>{const b=document.createElement('button');b.textContent=t;
    if(t===cur)b.className='on';
    const c=state.counts&&state.counts[t.toLowerCase()];
    if(c)b.innerHTML+=`<span class="count">${c}</span>`;
    b.onclick=()=>{cur=t;load();};n.appendChild(b);});
  const bd=state.binding;
  document.getElementById('bind').innerHTML = bd&&bd.ticket
    ? `bound to <b>${bd.ticket}</b> <span class="mut">(${bd.source})</span>`
    : `⚠ <span class="mut">no active ticket</span>`;
}
function drawBar(){
  const bd=state.binding, live=state.capture_live;
  let h=`<span class="dot ${live?'on':'off'}" title="${live?'capturing':'no recent capture'}"></span>`;
  h+=`<span class="binfo">${bd&&bd.ticket?`Active: <b>${bd.ticket}</b> <span class="mut">(${bd.source})</span>`:'<span class="mut">no active ticket</span>'}</span>`;
  h+=`<span class="picker" id="picker"></span>`;
  h+=`<span style="flex:1"></span>`;
  h+=`<button class="btn" onclick="openPicker()">Bind…</button>`;
  h+=`<button class="btn" onclick="doInterrupt()">Mark interrupt</button>`;
  h+=`<button class="btn go" onclick="reprocess()">↻ Process</button>`;
  h+=`<span class="now mut">${(state.now||'').replace('T',' ')}</span>`;
  document.getElementById('bar').innerHTML=h;
  if(pickerOpen)renderPicker();
}
function drawCap(){
  const el=document.getElementById('cap');if(!el)return;
  if(state.capture_live){el.innerHTML='';return;}
  el.innerHTML=`<div style="margin:10px 0;padding:0 20px"><div class="capwarn">
    ⚠ No capture in the last 10 min. In the terminal you work in, run once:
    <code>source "${esc(state.snippet||'')}"</code> — then commands you type there show up here live.</div></div>`;
}
function draw(){drawNav();drawBar();drawCap();}
async function openPicker(){pickerOpen=true;await renderPicker();}
async function renderPicker(){
  const el=document.getElementById('picker');if(!el)return;
  const d=await api('/api/candidates');
  let h=`<input type="text" id="bindin" placeholder="OPS-1234" style="width:120px" onkeydown="if(event.key==='Enter')bindTo(this.value)">`;
  h+=`<button class="btn ok" onclick="bindTo(document.getElementById('bindin').value)">Bind</button>`;
  (d.candidates||[]).forEach(c=>{h+=`<span class="chip" onclick="bindTo('${c.key}')">${c.key}</span>`;});
  h+=`<button class="btn" onclick="pickerOpen=false;draw()">✕</button>`;
  el.innerHTML=h;
}
async function bindTo(t){
  if(!t||!t.trim())return;
  const r=await api('/api/bind',{method:'POST',body:JSON.stringify({ticket:t.trim()})});
  pickerOpen=false; await refresh();
}
async function doInterrupt(){
  await api('/api/interrupt',{method:'POST'}); await refresh();
}
async function load(){
  drawNav();const m=document.getElementById('main');m.innerHTML='<div class="empty">Loading…</div>';
  if(cur==="Timeline")return renderTimeline(m);
  if(cur==="Episodes")return renderEpisodes(m,false);
  if(cur==="Unaccounted")return renderEpisodes(m,true);
  if(cur==="Drafts")return renderDrafts(m);
  if(cur==="Prompts")return renderPrompts(m);
  if(cur==="Stream")return renderStream(m);
  if(cur==="Logged")return renderLogged(m);
  if(cur==="Terminal")return renderTerminal(m);
  if(cur==="Ansible")return renderAnsible(m);
  if(cur==="Scratchpad")return renderScratchpad(m);
  if(cur==="Settings")return renderSettings(m);
}
async function renderTimeline(m){
  const d=await api('/api/timeline');
  if(!d.events.length){m.innerHTML='<div class="empty">No captured activity yet. Run some shell/git commands with capture enabled, then Re-process.</div>';return;}
  let h='<div class="toolbar"><button class="btn go" onclick="reprocess()">↻ Re-process</button></div><div class="card">';
  d.events.forEach(e=>{
    const label=e.type==='shell'?(e.exit?`<span style="color:var(--bad)">✗${e.exit}</span>`:'<span style="color:var(--ok)">✓</span>'):e.type;
    const txt=e.type==='shell'?esc(e.cmd):`${esc(e.action||'')} ${esc(e.key||e.branch||e.msg||'')}`;
    h+=`<div class="ev"><span class="mut">${fmt(e.ts)}</span><span>${label}</span><span class="mono">${txt} ${e.repo?`<small class="src">@${esc(e.repo)}</small>`:''}</span></div>`;
  });
  m.innerHTML=h+'</div>';
}
async function renderEpisodes(m,onlyUn){
  const d=await api('/api/episodes');
  let eps=d.episodes;if(onlyUn)eps=eps.filter(e=>e.kind==='unaccounted');
  let h='<div class="toolbar"><button class="btn go" onclick="reprocess()">↻ Re-process</button></div>';
  if(!eps.length){m.innerHTML=h+'<div class="empty">'+(onlyUn?'Nothing to triage — all activity bound.':'No episodes yet.')+'</div>';return;}
  eps.forEach(e=>{
    h+=`<div class="card"><div class="row">
      <span class="tag ${e.kind}">${e.kind}</span>
      <span class="tag">${e.activity}</span>
      ${e.ticket?`<span class="key">${e.ticket}</span>`:'<span class="mut">unbound</span>'}
      <span class="mut">${fmt(e.start_ts)} → ${fmt(e.end_ts)} · ${e.n_events} events</span></div>
      <div class="summary">${esc(e.summary)}</div></div>`;
  });
  m.innerHTML=h;
}
async function renderDrafts(m){
  const d=await api('/api/drafts');
  let h='<div class="toolbar"><button class="btn go" onclick="reprocess()">↻ Re-process</button></div>';
  if(!d.drafts.length){m.innerHTML=h+'<div class="empty">No drafts. Capture activity and Re-process.</div>';return;}
  d.drafts.forEach(x=>{
    h+=`<div class="card" id="d${x.id}"><div class="row">
      <span class="tag">${x.target}</span><span class="tag">${x.kind}</span>
      ${x.ref_key?`<span class="key">${x.ref_key}</span>`:''}
      <span class="status ${x.status}">${x.status}</span>
      <b style="flex:1">${esc(x.title)}</b></div>
      <pre id="b${x.id}">${esc(x.body)}</pre>
      <div class="actions">`;
    if(x.status==='draft'||x.status==='approved'){
      h+=`<button class="btn" onclick="editDraft(${x.id})">Edit</button>
          <button class="btn ok" onclick="act(${x.id},'approve')">${x.status==='approved'?'Approved ✓':'Approve'}</button>
          <button class="btn go" onclick="act(${x.id},'publish')">Publish ↗</button>
          <button class="btn bad" onclick="act(${x.id},'discard')">Discard</button>`;
    } else if(x.status==='published'){
      h+=`<span class="mut">published → ${esc(x.ref_key||'')}</span>`;
    }
    h+='</div></div>';
  });

    const rows=(e.breakdown||[]).map(b=>`<div class="bdrow"><span class="mut">${dayLabel(b.ts)}</span><span class="bdsecs">${fmtDur(b.secs)}</span><span class="mut">${b.count} item${b.count>1?'s':''}</span></div>`).join('');
    detail=`<div class="fdetail">${rows||'<span class="mut">no work attached</span>'}</div>`;
  }
  const canSend = e.draft_id && (e.draft_status==='draft'||e.draft_status==='approved');
  let actions='';
  if(sel) actions+=`<button class="btn go" onclick="addToEvent(${e.id})">＋ add ${sel}</button>`;
  if(canSend) actions+=`<button class="btn go" onclick="sendDraft(${e.draft_id})">Send ↗</button>`;
  if(e.kind==='logged'&&!e.pushed_jira){
    actions+=`<input class="tagin" id="pt-${e.id}" value="${esc(e.ticket||'')}" placeholder="ticket #" style="width:76px">`;
    actions+=`<button class="btn go" onclick="pushEntry(${e.id})" title="post this local time as a real Jira worklog">Push to Jira ↗</button>`;
  }
  if(e.draft_id) actions+=`<button class="btn" onclick="cur='Drafts';load()">Open</button>`;
  actions+=`<button class="btn" onclick="restoreEntry(${e.id})" title="return this work to the Stream">${e.kind==='disposed'?'Un-dispose':'Un-log'}</button>`;
  return `<div class="lgrow">
    <span class="fexp" onclick="toggleLogged(${e.id})">${open?'▾':'▸'}</span>
    <span class="fmain">
      <span class="lghead">${esc(kind)}</span>
      ${e.ticket?`<span class="schip tkt">${esc(e.ticket)}</span>`:''}
      ${e.tag?`<span class="schip tag">${esc(e.tag)}</span>`:''}
      <span class="lgtitle mut">${esc(prettyCwd(e.project)||e.title)}</span>
      <span class="schip">${e.count} item${e.count>1?'s':''}</span>${multiDay?`<span class="schip">${(e.breakdown||[]).length} days</span>`:''}
      ${statusChip}
      ${detail}
    </span>
    ${time}
    <span class="fact">${actions}</span></div>`;
}

// ---- Terminal: live interactive PTY sessions (xterm.js) ----
let ptyTabs=[], ptyActive=0, ptySeq=0;
function mkPty(){ptySeq++; return {name:'Term '+ptySeq,id:null,el:null,term:null,fit:null,off:0,timer:null,opened:false};}
function ensurePty(){ if(!ptyTabs.length){ptyTabs=[mkPty()];ptyActive=0;} }
function addPty(){ ptyTabs.push(mkPty()); ptyActive=ptyTabs.length-1; load(); }
function switchPty(i){ ptyActive=i; load(); }
function closePty(i){
  const t=ptyTabs[i];
  if(t.timer)clearInterval(t.timer);
  if(t.id)api('/api/pty/close',{method:'POST',body:JSON.stringify({id:t.id})});
  if(t.term)try{t.term.dispose();}catch(e){}
  ptyTabs.splice(i,1);
  if(ptyActive>=ptyTabs.length)ptyActive=Math.max(0,ptyTabs.length-1);
  load();
}
function renderTerminal(m){
  ensurePty();
  const tabs=ptyTabs.map((x,i)=>`<button class="tterm${i===ptyActive?' on':''}" onclick="switchPty(${i})">${esc(x.name)}<span class="x" onclick="event.stopPropagation();closePty(${i})">×</span></button>`).join('');
  m.innerHTML=`<div class="card">
    <div class="row"><b>Terminal</b><span class="mut">a live shell on this machine — run <span class="mono">claude</span>, ssh, git, anything. Commands are captured as episodes.</span></div>
    <div class="tterms">${tabs}<button class="tterm add" onclick="addPty()">+ tab</button></div>
    <div id="ptymount"></div>
  </div>`;
  if(!window.Terminal){document.getElementById('ptymount').innerHTML='<div class="mut" style="padding:20px">terminal engine failed to load</div>';return;}
  const t=ptyTabs[ptyActive], mount=document.getElementById('ptymount');
  if(!t.el){t.el=document.createElement('div');t.el.className='xtermhost';}
  mount.appendChild(t.el);
  if(!t.term){
    t.term=new Terminal({fontSize:13,cursorBlink:true,scrollback:8000,fontFamily:'ui-monospace,SFMono-Regular,Menlo,monospace',theme:{background:'#0b0e14',foreground:'#d6dbe6'}});
    t.fit=new FitAddon.FitAddon(); t.term.loadAddon(t.fit); t.term.open(t.el);
    t.term.onData(d=>{ if(t.id)api('/api/pty/write',{method:'POST',body:JSON.stringify({id:t.id,data:d})}); });
  }
  try{t.fit.fit();}catch(e){}
  if(!t.opened)openPty(t); else { ptyResize(t); setTimeout(()=>t.term.focus(),0); }
}
async function openPty(t){
  t.opened=true;
  const r=await api('/api/pty/open',{method:'POST',body:JSON.stringify({cols:t.term.cols,rows:t.term.rows,cwd:''})});
  if(!r.ok){t.term.write('\r\n[failed to open shell: '+(r.error||'')+']\r\n');return;}
  t.id=r.id; t.off=0; t.timer=setInterval(()=>pollPty(t),120);
  setTimeout(()=>t.term.focus(),0);
}
async function pollPty(t){
  if(!t.id)return;
  const r=await api('/api/pty/read',{method:'POST',body:JSON.stringify({id:t.id,from:t.off})});
  if(r.data){const bytes=Uint8Array.from(atob(r.data),c=>c.charCodeAt(0));t.term.write(bytes);t.off=r.next;}
  if(r.alive===false){clearInterval(t.timer);t.timer=null;t.term.write('\r\n[session ended]\r\n');}
}
function ptyResize(t){ if(t.id&&t.term)api('/api/pty/resize',{method:'POST',body:JSON.stringify({id:t.id,cols:t.term.cols,rows:t.term.rows})}); }
window.addEventListener('resize',()=>{ if(cur==='Terminal'){const t=ptyTabs[ptyActive];if(t&&t.fit){try{t.fit.fit();}catch(e){}ptyResize(t);}} });

async function renderAnsible(m){
  m.innerHTML=`<div class="card">
    <div class="row"><b>Ansible</b><span class="mut">ansible-playbook</span></div>
    <label>Playbook</label><input type="text" id="apb" class="mono" placeholder="site.yml" style="width:340px">
    <label>Inventory (-i)</label><input type="text" id="ainv" class="mono" placeholder="inventory.ini" style="width:340px">
    <label>Extra vars (-e)</label><input type="text" id="aev" class="mono" placeholder="key=value key2=value2" style="width:340px">
    <label>Working directory</label><input type="text" id="acwd" class="mono" placeholder="$HOME" style="width:340px">
    <label style="display:flex;gap:6px;align-items:center;margin-top:12px"><input type="checkbox" id="achk" style="width:auto" checked> <span>--check (dry run first)</span></label>
    <div class="actions"><button class="btn go" onclick="runAnsible()">Run playbook</button></div>
    <pre id="aout" class="term" style="height:46vh;min-height:300px;border-radius:7px">(output appears here)</pre>
  </div>`;
}
function runAnsible(){
  const g=id=>document.getElementById(id);
  const pb=g('apb').value.trim(), out=g('aout');
  if(!pb){out.textContent='playbook required';return;}
  let cmd='ansible-playbook';
  if(g('ainv').value.trim())cmd+=' -i '+g('ainv').value.trim();
  cmd+=' '+pb;
  if(g('aev').value.trim())cmd+=' -e "'+g('aev').value.trim()+'"';
  if(g('achk').checked)cmd+=' --check';
  out.textContent='$ '+cmd+'\nrunning…';
  api('/api/run',{method:'POST',body:JSON.stringify({cmd,cwd:g('acwd').value})}).then(r=>{
    if(!r.ok){out.textContent='error: '+(r.error||'failed');return;}
    pollAnsible(r.id,out,cmd);
  });
}
async function pollAnsible(id,out,cmd){
  const r=await api('/api/run/'+id);
  out.textContent='$ '+cmd+'\n'+(r.output||'running…')+(r.done?('\n[exit '+r.exit+']'):'');
  out.scrollTop=out.scrollHeight;
  if(!r.done)setTimeout(()=>pollAnsible(id,out,cmd),700);
}

let lastSig='';
refresh().then(()=>{lastSig=sigOf(state);load();});
function sigOf(s){return JSON.stringify([s.counts,s.binding,s.capture_live]);}
// Live refresh: update the bar/nav every few seconds, and reload the active
// tab's content only when the underlying data actually changed — and never
// while the engineer is mid-edit or has the bind picker open (busy()).
setInterval(async()=>{
  if(busy())return;
  state=await api('/api/state');
  draw();
  const sig=sigOf(state);
  // Don't auto-reload the interactive work surfaces (would wipe input/output),
  // or the Stream while items are selected (would drop the selection).
  const interactive = cur==='Terminal' || cur==='Ansible' || cur==='Scratchpad' || (cur==='Stream' && (buildIds.length>0||builtDraftId));
  if(sig!==lastSig){lastSig=sig; if(!interactive) load();}
},4000);

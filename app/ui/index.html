<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scribe</title>
<style>
  html{color-scheme:light dark}
  body{font:15px/1.5 system-ui,sans-serif;margin:0;min-height:100vh;display:grid;place-items:center;background:Canvas;color:CanvasText}
  main{max-width:460px;padding:24px}
  h1{font-size:18px;margin:0 0 8px}
  p{margin:0 0 10px;opacity:.8}
  code{font-size:13px}
</style>
</head>
<body>
<main>
  <h1>Scribe couldn't start</h1>
  <p>Its local service did not come up. Another program may be using Scribe's port, or its data folder may not be writable.</p>
  <p>Quit Scribe from the tray menu and open it again. If this keeps happening, run <code>scribe panel</code> in a terminal to see the error.</p>
</main>
</body>
</html>

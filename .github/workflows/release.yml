name: release

# Build native binaries for Linux and macOS and attach them to the GitHub
# Release. Runs when a version tag (v*) is pushed, or on manual dispatch against
# an existing tag. macOS binaries are built on GitHub's macOS runners — they
# can't be cross-compiled from Linux, which is why the earlier Linux-only
# release doesn't run on Macs.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and upload to (e.g. v0.2.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl   # static, runs on any x86-64 Linux
            label: linux-x86_64-musl
          - os: macos-14
            target: aarch64-apple-darwin         # Apple Silicon (M1+) — current Macs
            label: macos-arm64

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        shell: bash
        env:
          # The TLS dependency compiles C; point its build at musl-gcc.
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          set -eu
          RAW="${{ github.event.inputs.tag || github.ref_name }}"
          VER="${RAW#v}"
          NAME="scribe-${VER}-${{ matrix.target }}"
          BIN="target/${{ matrix.target }}/release/scribe"
          strip "$BIN" || true
          mkdir -p "stage/$NAME"
          cp "$BIN" "stage/$NAME/scribe"
          cp README.md scribe-prd.md install.sh "stage/$NAME/" 2>/dev/null || true
          mkdir -p dist
          tar -C stage -czf "dist/${NAME}.tar.gz" "$NAME"
          cp "$BIN" "dist/${NAME}"
          ( cd dist && shasum -a 256 "${NAME}.tar.gz" "${NAME}" > "${NAME}.sha256" )
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: dist/*

  publish:
    name: publish release
    needs: build
    if: ${{ always() }}   # publish with whatever platforms succeeded
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect assets + combined checksums
        shell: bash
        run: |
          set -eu
          mkdir -p dist
          find artifacts -type f \( -name 'scribe-*' -o -name '*.sha256' \) -exec cp {} dist/ \;
          ( cd dist && cat *.sha256 > SHA256SUMS && rm -f *.sha256 )
          ls -l dist

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: dist/*
          fail_on_unmatched_files: true
